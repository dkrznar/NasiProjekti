{% extends "base.html" %}
{% block title %}Uredi bilješku{% endblock %}

{% block sadrzaj %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Uredi bilješku</h5>
                <form method="POST">
                    <textarea name="tekst" class="form-control mb-3" rows="4" required>{{ biljeska.tekst }}</textarea>
                    <button type="submit" class="btn btn-primary">Spremi</button>
                    <a href="{{ url_for('projekt_detalji', projekt_id=biljeska.projekt_id) }}" class="btn btn-outline-secondary">Odustani</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

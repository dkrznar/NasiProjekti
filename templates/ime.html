{% extends "base.html" %}
{% block title %}Tko si?{% endblock %}

{%block sadrzaj%}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Dobrodošla/o!</h5>
                <p class="text-muted">Upiši svoje ime kako bi se znalo tko je unio podatke.</p>
                <form method="POST">
                    <input type="hidden" name="next" value="{{ next }}">
                    <input type="text" name="ime" class="form-control mb-3" placeholder="Vaše ime" required autofocus>
                    <button type="submit" class="btn btn-primary">Spremi</button>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}

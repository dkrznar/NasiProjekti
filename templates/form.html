{% extends "base.html" %}
{% block tite %}Novi projekt{% endblock %}

{% block sadrzaj %}
<div class="card shadow-sm">
    <div class="card-body">
        <h5 class="card-title mb-3">Novi projekt</h5>
 
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label">Naziv projekta</label>
                    <input type="text" name="naziv" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Klasa predmeta</label>
                    <input type="text" name="klasa" class="form-control" placeholder="npr. 402-08/26-01/15">
                </div>
 
                <div class="col-md-3">
                    <label class="form-label">Datum početka</label>
                    <input type="date" name="datum_pocetka" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Datum završetka</label>
                    <input type="date" name="datum_zavrsetka" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-select">
                        {% for s in statusi %}
                        <option value="{{ s }}">{{ s }}</option>
                        {% endfor %}
                    </select>
                </div>
 
                <div class="col-md-6">
                    <label class="form-label">Naziv poziva</label>
                    <input type="text" name="naziv_poziva" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Nadležno tijelo</label>
                    <input type="text" name="nadlezno_tijelo" class="form-control" placeholder="npr. Ministarstvo regionalnoga razvoja">
                </div>
 
                <div class="col-md-4">
                    <label class="form-label">Dobiveni iznos (€)</label>
                    <input type="number" step="0.01" min="0" name="dobiveni_iznos" class="form-control" value="0">
                </div>
                <div class="col-md-4">
                    <label class="form-label">Naš iznos (€)</label>
                    <input type="number" step="0.01" min="0" name="nas_iznos" class="form-control" value="0">
                </div>
 
                <div class="col-12">
                    <label class="form-label">Opis</label>
                    <textarea name="opis" class="form-control" rows="3"></textarea>
                </div>
            </div>
 
            <div class="mt-4">
                <button type="submit" class="btn btn-primary">Spremi projekt</button>
                <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Odustani</a>
            </div>
        </form>
    </div>

</div>




{% endblock %}

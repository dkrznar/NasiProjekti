<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Naši Projekti{%endblock%}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class = "bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" href="{{ url_for('index') }}">Naši projekti</a>
        <div>
            <a class="btn btn-light btn-sm" href="{{ url_for('novi_projekt') }}">+ Novi projekt</a>
        </div>
    </div>
</nav>

    <div class="container">
        {% with poruke = get_flashed_messages(with_categories=true) %}
            {% for kategorija, poruka in poruke %}
            <div class="alert alert-{{kategorija}} alert-dismissible fade show">
                {{ poruka }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            {% endfor %}
        {% endwith %}
        
        {% block sadrzaj %} {% endblock %}
    </div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
